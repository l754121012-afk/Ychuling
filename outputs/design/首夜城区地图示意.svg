<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
  <rect width="1500" height="980" fill="#0d131d"/>
  <text x="750" y="46" text-anchor="middle" fill="#f4f7fb" font-size="32" font-family="sans-serif">首夜城区 / First Night District</text>

  <g font-family="sans-serif">
    <rect x="610" y="82" width="300" height="110" rx="14" fill="#24463b" stroke="#57d4a5" stroke-width="3"/>
    <text x="760" y="124" text-anchor="middle" fill="#eafff3" font-size="22">夜巡司</text>
    <text x="760" y="154" text-anchor="middle" fill="#9ed4c0" font-size="15">安全屋 / 休息点 / 支线台</text>

    <rect x="100" y="300" width="360" height="300" rx="18" fill="#2e2a24" stroke="#c98a4b" stroke-width="3"/>
    <text x="280" y="335" text-anchor="middle" fill="#ffd8a0" font-size="24">夜市街 A</text>
    <text x="280" y="362" text-anchor="middle" fill="#b8a58c" font-size="16">摊位与遮雨棚高低跳跃</text>
    <rect x="135" y="390" width="150" height="70" rx="10" fill="#3c3329"/>
    <text x="210" y="427" text-anchor="middle" fill="#ffd8a0" font-size="15">案件1 炒粉灰影</text>
    <rect x="330" y="390" width="110" height="70" rx="10" fill="#4b3f2d"/>
    <text x="385" y="427" text-anchor="middle" fill="#ffe6b0" font-size="15">夜巡印章</text>

    <rect x="640" y="300" width="360" height="310" rx="18" fill="#352531" stroke="#b0719e" stroke-width="3"/>
    <text x="820" y="335" text-anchor="middle" fill="#f0c6df" font-size="24">旧戏院 B</text>
    <text x="820" y="362" text-anchor="middle" fill="#c7a5b8" font-size="16">观众席 / 舞台 / 吊杆层</text>
    <rect x="680" y="390" width="140" height="70" rx="10" fill="#4a2c43"/>
    <text x="750" y="427" text-anchor="middle" fill="#f0c6df" font-size="15">案件2 幕布歌声</text>
    <rect x="840" y="390" width="130" height="70" rx="10" fill="#6a3f5a"/>
    <text x="905" y="427" text-anchor="middle" fill="#ffe0f0" font-size="15">戏票钥匙</text>

    <rect x="1080" y="300" width="330" height="310" rx="18" fill="#1f3140" stroke="#6fa6d8" stroke-width="3"/>
