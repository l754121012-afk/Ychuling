    <text x="1245" y="362" text-anchor="middle" fill="#91adc4" font-size="16">大厅 / 站台 / 寄存室</text>
    <rect x="1110" y="390" width="140" height="70" rx="10" fill="#27465a"/>
    <text x="1180" y="427" text-anchor="middle" fill="#bfe3ff" font-size="15">案件3 衣柜呼吸</text>
    <rect x="1270" y="390" width="110" height="70" rx="10" fill="#315f75"/>
    <text x="1325" y="427" text-anchor="middle" fill="#e0f4ff" font-size="15">神秘鬼</text>

    <rect x="640" y="760" width="260" height="130" rx="16" fill="#472b2b" stroke="#ff6d5a" stroke-width="3"/>
