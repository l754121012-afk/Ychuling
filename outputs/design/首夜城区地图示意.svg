    <text x="770" y="840" text-anchor="middle" fill="#d9a7a0" font-size="15">击败后获得封印钥匙</text>

    <rect x="1040" y="750" width="260" height="150" rx="16" fill="#40391f" stroke="#ffe08a" stroke-width="4"/>
    <text x="1170" y="810" text-anchor="middle" fill="#ffe9a8" font-size="23">封印终点</text>
    <text x="1170" y="840" text-anchor="middle" fill="#e8d18a" font-size="15">可见但锁住，Boss后开启</text>

    <path d="M760 192 L280 300" stroke="#57d4a5" stroke-width="4" stroke-dasharray="8 7" fill="none"/>
    <path d="M760 192 L820 300" stroke="#57d4a5" stroke-width="4" stroke-dasharray="8 7" fill="none"/>
    <path d="M460 420 L640 420" stroke="#ffd166" stroke-width="4" stroke-dasharray="8 7" fill="none"/>
    <path d="M1000 420 L1080 420" stroke="#ffd166" stroke-width="4" stroke-dasharray="8 7" fill="none"/>
    <path d="M820 610 L770 760" stroke="#ff6d5a" stroke-width="4" stroke-dasharray="8 7" fill="none"/>
    <path d="M1170 610 L1170 750" stroke="#ffe08a" stroke-width="4" stroke-dasharray="8 7" fill="none"/>
    <path d="M820 890 L1170 890" stroke="#6fa6d8" stroke-width="4" stroke-dasharray="8 7" fill="none"/>

    <text x="530" y="400" text-anchor="middle" fill="#ffd166" font-size="17">夜巡印章门</text>
    <text x="1045" y="400" text-anchor="middle" fill="#ffd166" font-size="17">戏票钥匙门</text>
    <text x="760" y="680" text-anchor="middle" fill="#ff6d5a" font-size="17">神秘鬼揭示</text>
    <text x="1300" y="665" text-anchor="middle" fill="#ffe08a" font-size="17">封印门</text>
    <text x="990" y="915" text-anchor="middle" fill="#6fa6d8" font-size="17">下一区域入口（未开放）</text>
